name: Publish

# Publishing a GitHub release tagged vX.Y.Z (matching pihello.__version__)
# runs the full CI pipeline, then uploads the exact distributions CI built and
# tested to PyPI via trusted publishing.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    # `$/` self-repository syntax is not understood by actionlint 1.7.12 yet.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  verify:
    name: Check tag matches version
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version=$(PYTHONPATH=src python3 -c 'import pihello; print(pihello.__version__)')
          wheel=$(basename dist/*.whl)
          sdist=$(basename dist/*.tar.gz)
          echo "tag=$TAG __version__=$version wheel=$wheel sdist=$sdist"
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::Release tag '$TAG' does not match pihello.__version__ (expected 'v$version')."
            exit 1
          fi
          if [[ "$wheel" != "pihello-$version-py3-none-any.whl" || "$sdist" != "pihello-$version.tar.gz" ]]; then
            echo "::error::Built distributions ($wheel, $sdist) do not match version $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  pypi:
    name: Publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/pihello/${{ needs.verify.outputs.version }}/
    permissions:
      id-token: write # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  release-assets:
    name: Attach distributions to the release
    needs: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # upload release assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber
