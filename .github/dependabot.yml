version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows/ up to date (one PR a month).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
